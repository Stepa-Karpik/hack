server {
 listen 80;
 server_name dekanat.karpovprod.ru;
 location /.well-known/acme-challenge/ { root /var/www/online-dekanat-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name dekanat.karpovprod.ru;
 ssl_certificate /etc/letsencrypt/live/dekanat.karpovprod.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dekanat.karpovprod.ru/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 14m;
 client_body_timeout 20s;
 limit_conn dekanat_connections 8;
 limit_req_status 429;
 access_log off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; frame-src blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 location = /v1/jobs {
  limit_req zone=dekanat_upload burst=2 nodelay;
  proxy_pass http://127.0.0.1:18765;
  proxy_set_header Host $host;
  proxy_read_timeout 30s;
 }
 location /v1/ {
  limit_req zone=dekanat_api burst=20 nodelay;
  proxy_pass http://127.0.0.1:18765;
  proxy_set_header Host $host;
 }
 location / { proxy_pass http://127.0.0.1:18765; proxy_set_header Host $host; }
}
