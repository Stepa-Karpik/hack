server {
 listen 80;
 server_name dekanat.karpovprod.ru;
 location /.well-known/acme-challenge/ { root /var/www/online-dekanat-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name dekanat.karpovprod.ru;
 ssl_certificate /etc/letsencrypt/live/dekanat.karpovprod.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dekanat.karpovprod.ru/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 # up to 20 files x 10 MB per batch upload
 client_max_body_size 205m;
 client_body_timeout 60s;
 limit_conn dekanat_connections 24;
 limit_req_status 429;
 access_log off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto $scheme;

 # GPU agent (the owner's computer) connects here, outbound from its side.
 location = /agent/ws {
  proxy_pass http://127.0.0.1:18780;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
 }
 location /api/auth/ {
  limit_req zone=dekanat_auth burst=5 nodelay;
  proxy_pass http://127.0.0.1:18780;
 }
 location /api/ {
  limit_req zone=dekanat_api burst=40 nodelay;
  proxy_pass http://127.0.0.1:18780;
  proxy_read_timeout 300s;
  proxy_request_buffering on;
  # chat answers stream as NDJSON
  proxy_buffering off;
 }
 location / { proxy_pass http://127.0.0.1:18780; }
}
